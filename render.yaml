services:
  - type: web
    name: geuphaeyo-hwajangsil-api
    runtime: node
    plan: free
    region: singapore
    branch: service
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: geuphaeyo-hwajangsil-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://temporary-nimble-cyclone-rxsi871.vercel.app

databases:
  - name: geuphaeyo-hwajangsil-db
    plan: free
    region: singapore
    databaseName: geuphaeyo
    user: geuphaeyo
    postgresMajorVersion: "17"
